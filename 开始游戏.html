<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161512">
<title>纳西妲的旅行</title>
<style>
  :root{
    --bg:#161512; --card:#26231e; --card2:#211f1a; --line:#3a352c;
    --fg:#efe9dd; --fg2:#a49c8c; --fg3:#6f685c;
    --green:#8ec96a; --gold:#e2b25c; --warn:#e0a95c; --bad:#d98b7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  /* 字体：优先用你自己放进去的开源字体，找不到就回退到系统字体。
     本项目不打包任何字体文件，所以没有字体授权风险。
     想让所有平台显示一致，把 OFL 授权的字体（推荐霞鹜文楷 LXGW WenKai）
     放进 assets/font/，再取消下面这段注释即可。 */
  /*
  @font-face{font-family:"LXGW WenKai";font-display:swap;font-weight:400;
    src:url("assets/font/LXGWWenKai-Regular.woff2") format("woff2")}
  */
  body{
    background:radial-gradient(1400px 800px at 50% -10%, #24221c 0%, var(--bg) 60%) fixed;
    color:var(--fg);
    -webkit-font-smoothing:antialiased;
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC",
      "WenQuanYi Micro Hei",system-ui,sans-serif;
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:1000px;min-height:100%;display:flex;flex-direction:column;padding:0 0 32px}

  .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;
       padding:14px 16px 10px;position:sticky;top:0;z-index:10;
       background:linear-gradient(180deg,rgba(22,21,18,.97),rgba(22,21,18,.75) 70%,transparent);
       backdrop-filter:blur(6px)}
  .hdr h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.04em}
  .pad{padding:0 16px}

  .btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;
       font-family:inherit;cursor:pointer;transition:.15s transform;font-weight:600}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:linear-gradient(180deg,#9ed474,#7bb355);color:#17240f;
       box-shadow:0 6px 18px rgba(142,201,106,.22)}
  .btn-ghost{background:transparent;color:var(--fg2);border:1px solid var(--line);
       border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500;width:auto;cursor:pointer;
       font-family:inherit;transition:.15s}
  .btn-ghost:hover{color:var(--fg);border-color:#4d4638}
  .btn-ghost:disabled{opacity:.4;cursor:default}
  .btn-ghost[data-hot]{border-color:var(--green);color:#bcdba0}
  .btn-ghost.danger{color:var(--bad);border-color:#4a322c}
  .btn-row{display:flex;gap:10px;margin-top:18px}
  .btn-row .btn{flex:1}
  .hint{color:var(--fg3);font-size:12.5px;line-height:1.8;margin-top:14px}
  .label{color:var(--fg2);font-size:13px;letter-spacing:.06em;margin:22px 0 10px}
  .muted{color:var(--fg3);font-size:13px}
  .small{font-size:12px}
  .note{background:#2e2a20;border-left:2px solid var(--gold);color:#e6d4ac;
        padding:10px 14px;margin:8px 16px 0;border-radius:8px;font-size:13px}
  .input{width:100%;background:#1b1915;border:1px solid var(--line);border-radius:10px;
         color:var(--fg);padding:12px 13px;font-size:14px;font-family:inherit;margin:10px 0 12px}

  /* ---- 家：真·全屏 16:9 世界，控件全部在画面里 ---- */
  .screen-home{position:fixed;inset:0;z-index:2;background:#0b0a09}
  .stage-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .stage-box{position:relative;width:min(100vw,calc(100vh * 16 / 9));max-height:100vh}
  /* 这一层只在手机竖屏时用来横向滚动（见下面的媒体查询）；
     宽屏上 display:contents 等于它不存在，不影响原来的布局 */
  .stage-scroll{display:contents}
  .stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#7fa862;
         cursor:pointer;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #world-fg{pointer-events:none}

  .stage-top{position:absolute;left:1.1em;top:1.0em;display:flex;gap:.5em;align-items:center;
             background:rgba(14,13,11,.55);backdrop-filter:blur(4px);border-radius:.55em;
             padding:.3em .75em;font-size:.72em;pointer-events:none;color:#e8e1d2}
  .state-badge{color:#bcdba0;font-weight:600}
  .state-spot{color:#c9c0ae}
  .stage-hint{position:absolute;left:50%;top:1.0em;transform:translateX(-50%);
              background:rgba(14,13,11,.5);border-radius:.55em;padding:.28em .8em;
              font-size:.7em;color:rgba(255,255,255,.78);pointer-events:none;
              animation:fadeHint 9s forwards}
  @keyframes fadeHint{0%,55%{opacity:1}100%{opacity:0}}

  .home-controls{position:absolute;left:0;right:0;bottom:0;padding:2.2em 1.1em 1.0em;
                 background:linear-gradient(180deg,transparent,rgba(12,11,9,.5) 40%,rgba(12,11,9,.88))}

  .stage-bar{display:flex;gap:.45em;flex-wrap:wrap;align-items:center}
  .sbtn{flex:0 0 auto;background:rgba(38,35,30,.88);border:1px solid rgba(92,84,68,.85);
        color:#efe9dd;border-radius:.55em;padding:.5em .85em;font-size:.78em;font-family:inherit;
        cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:.35em;
        white-space:nowrap;line-height:1.2}
  .sbtn:hover{border-color:var(--green);background:rgba(48,58,36,.92)}
  .sbtn.go{background:linear-gradient(180deg,#9ed474,#7bb355);color:#17240f;border-color:transparent;
           font-weight:700;padding:.5em 1.25em}
  .sbtn.hot{border-color:var(--green);color:#bcdba0}
  .sbtn.small{padding:.35em .7em;font-size:.72em}
  .sbtn i{font-style:normal;background:rgba(142,201,106,.22);color:#bcdba0;border-radius:.6em;
          padding:0 .4em;font-size:.85em}

  /* 她说的话：人物旁边的气泡（比底部那行显眼） */
  .bubble{position:absolute;left:0;top:0;max-width:34%;background:rgba(252,249,242,.97);
          color:#2a2620;border-radius:.7em;padding:.45em .72em;font-size:.76em;line-height:1.55;
          box-shadow:0 .5em 1.4em rgba(0,0,0,.45);display:none;
          pointer-events:none;z-index:3;white-space:pre-wrap}
  .bubble.show{display:block}
  .bubble:after{content:'';position:absolute;bottom:-.42em;left:1.1em;
                width:0;height:0;border-left:.42em solid transparent;
                border-right:.42em solid transparent;border-top:.48em solid rgba(252,249,242,.97)}
  .bubble.left:after{left:auto;right:1.1em}

  /* 田地就地操作面板：小一点、放到田的上方，别挡住人物 */
  .stage-sheet{position:absolute;left:50%;top:15%;transform:translateX(-50%);
               width:min(23em,60%);background:rgba(30,28,24,.96);border:1px solid #465a34;
               border-radius:.7em;padding:.8em;box-shadow:0 1em 2em rgba(0,0,0,.6);
               backdrop-filter:blur(6px);z-index:4}
  .stage-sheet .sheet-head{font-size:.82em;margin-bottom:.35em}
  .stage-sheet .sheet-body .label{font-size:.7em;margin:.2em 0 .4em}
  .stage-sheet .sheet-body .chips{gap:.3em}
  .stage-sheet .sheet-body .chip{font-size:.68em;padding:.4em .5em;min-width:29%;border-radius:.5em}
  .stage-sheet .sheet-body .grow-name{font-size:.8em}
  .stage-sheet .sheet-body .grow-sub{font-size:.7em;margin:.3em 0 .5em}
  .stage-sheet .sheet-body .btn-primary{font-size:.78em;padding:.55em}
  .stage-sheet .sheet-body .sbtn{padding:.35em .75em;font-size:.72em}

  /* 画面内的半透明弹窗：不切屏，宽度约一半到四分之三，带滚动条 */
  .modal-layer{position:absolute;inset:0;z-index:6;display:flex;align-items:center;
               justify-content:center;padding:3% 4%;background:rgba(8,7,6,.52);
               backdrop-filter:blur(3px);font-size:15px}
  .modal{width:min(72%,54em);max-height:94%;display:flex;flex-direction:column;
         background:rgba(30,28,24,.97);border:1px solid #3f3a30;border-radius:.9em;
         box-shadow:0 1.6em 3.5em rgba(0,0,0,.7);overflow:hidden}
  .modal-head{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;
              padding:.7em 1.1em;border-bottom:1px solid var(--line);font-size:1.05em}
  .modal-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:1.1em;
              overscroll-behavior:contain}
  .modal-body .pad{padding:0}
  .modal-body::-webkit-scrollbar{width:9px}
  .modal-body::-webkit-scrollbar-thumb{background:#4a4438;border-radius:99px}
  .modal-body::-webkit-scrollbar-track{background:transparent}

  /* 窄屏 / 竖屏：舞台在上，控件落到下方，避免遮住画面 */
  @media (max-width:899px), (max-aspect-ratio:1/1){
    .screen-home{position:static;background:transparent}
    .stage-wrap{position:static;display:block}

    /* 手机上如果只按屏幕宽度铺 16:9，画面高度只剩屏幕的四分之一，
       而且 stage 的浮层字号是 clamp(宽/62, 9, 20) —— 会被下限卡在 9px，小到看不清。
       所以竖屏时改成**按屏幕高度定尺寸**，左右超出屏幕的部分用横向拖动查看。
       一行字和画面都跟着变大，想横屏的玩家横过来就是正好铺满。 */
    .stage-box{width:100%;max-height:none}
    .stage-scroll{display:block;overflow-x:auto;overflow-y:hidden;
                  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
    .stage{width:auto;height:46vh;min-height:190px;border-radius:14px}

    .home-controls{position:static;background:none;padding:0}
    .stage-line{padding:1em 0 0;text-shadow:none}
    .stage-sheet{position:static;transform:none;width:auto;margin-top:1em}
    .stage-hint{display:none}
    .modal-layer{position:fixed;padding:4%}
    .modal{width:96%;max-height:88%}
  }

  /* 竖屏提示：出现在屏幕正中，几秒后自己淡掉。
     不挡操作（pointer-events:none）、不强制旋转 —— 爱竖屏就竖屏。 */
  .rotate-hint{display:none}
  @media (max-width:899px) and (orientation:portrait){
    .rotate-hint{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
                 z-index:60;background:rgba(14,13,11,.94);color:#e8e1d2;
                 border:1px solid #4d4638;border-radius:999px;padding:.7em 1.6em;
                 font-size:17px;letter-spacing:.08em;white-space:nowrap;
                 pointer-events:none;box-shadow:0 10px 34px rgba(0,0,0,.7);
                 animation:rotateHint 6s forwards}
  }
  @keyframes rotateHint{0%,68%{opacity:1}100%{opacity:0;visibility:hidden}}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 10px;
        cursor:pointer;font-family:inherit;color:var(--fg);display:flex;flex-direction:column;gap:3px;
        align-items:flex-start;transition:.15s}
  .tile:hover{border-color:#4d4638}
  .tile.hot{border-color:var(--green);background:#242c1e}
  .tile-label{font-size:14px;font-weight:600}
  .tile-sub{font-size:11.5px;color:var(--fg3)}

  /* ---- chips ---- */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--fg);
        border-radius:13px;padding:11px 13px;font-size:14px;cursor:pointer;font-family:inherit;
        display:flex;flex-direction:column;gap:2px;text-align:left;transition:.15s;flex:1 1 auto;min-width:30%}
  .chip small{color:var(--fg3);font-size:11.5px;line-height:1.5}
  .chip.on{border-color:var(--green);background:#242c1e;color:#dff0cd}
  .chip.on small{color:#9ab98a}
  .chips.regions .chip{min-width:21%;padding:9px 10px;font-size:13.5px}

  /* ---- 首次选家乡 ---- */
  .choose{padding-top:26px}
  .choose h2{font-size:21px;margin:0 0 12px;letter-spacing:.06em}

  /* ---- 厨房 ---- */
  .dishes{display:flex;flex-direction:column;gap:11px}
  .dish{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;opacity:.62}
  .dish.can{opacity:1;border-color:#465a34}
  .dish-head{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
  .dish-head .own{font-size:11.5px;color:var(--green)}
  .dish-desc{color:var(--fg3);font-size:12.5px;margin:6px 0 8px;line-height:1.7}
  .dish-need{display:flex;flex-wrap:wrap;gap:9px;font-size:12px;margin-bottom:6px}
  .dish-need .ok{color:#9ab98a}
  .dish-need .lack{color:var(--bad)}
  .dish-eff{font-size:11.5px;color:var(--fg3);margin-bottom:11px}
  .dish .btn-ghost{width:100%;text-align:center}

  /* ---- 玩具 ---- */
  .toy{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:12px;margin-bottom:11px;align-items:center}
  .toy-canvas{width:88px;flex:0 0 88px;background:#1e1c18;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .toy-body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .toy-body b{font-size:14.5px}
  .toy-desc{color:var(--fg3);font-size:12px}
  .toy-line{color:#8f9a7a;font-size:12px;font-style:italic}
  /* 仓库：稀有道具条目 */
  .drops{display:flex;flex-direction:column;gap:9px}
  .drop.own{border-left-color:var(--rare);background:#241f2e}
  .drop-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
  .drop-own{font-size:11.5px;color:var(--rare)}
  .drop-none{font-size:11.5px;color:var(--fg3)}
  .drop-desc{font-size:12.5px;color:var(--fg3);margin:4px 0 6px}
  .drop-eff{font-size:12px;color:#9ab98a}
  .drop-src{font-size:11.5px;color:var(--fg3);margin-top:3px}
  .toy-on{color:var(--green);font-size:11.5px}
  .toy-act{flex:0 0 auto}

  /* ---- 交流 ---- */
  .chat-stage{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
  .say-bubble{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--green);
              border-radius:12px;padding:13px 15px;font-size:14px;color:#e4dccb;line-height:1.8}
  .topics{display:flex;flex-direction:column;gap:9px}
  .topic{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;
         padding:14px;font-size:14.5px;font-family:inherit;cursor:pointer;text-align:left;transition:.15s}
  .topic:hover{border-color:var(--green)}
  .chat-log{display:flex;flex-direction:column;gap:9px;max-height:280px;overflow-y:auto;
            padding:4px 2px;margin-bottom:6px}
  .msg{max-width:82%;padding:10px 14px;border-radius:13px;font-size:14px;line-height:1.7}
  .msg.me{align-self:flex-end;background:#2f3a24;color:#dfeacf;border:1px solid #465a34}
  .msg.her{align-self:flex-start;background:var(--card);color:#e4dccb;border:1px solid var(--line)}
  .say-opts{display:flex;flex-direction:column;gap:8px}
  .say-opt{background:transparent;border:1px dashed var(--line);color:var(--fg2);border-radius:11px;
           padding:11px 14px;font-size:14px;font-family:inherit;cursor:pointer;text-align:left}
  .say-opt:hover{border-color:var(--green);color:var(--fg);border-style:solid}
  .ai-tag{display:inline-block;margin-left:6px;font-size:9.5px;color:#9ab98a;
          border:1px solid #465a34;border-radius:4px;padding:0 4px;vertical-align:middle}
  .msg.pending{opacity:.5;letter-spacing:.2em}
  .free-row{display:flex;gap:8px;align-items:stretch;margin-top:12px}
  .free-row .input{margin:0;flex:1}
  .free-row .sbtn{font-size:14px;padding:.6em 1.1em}

  /* ---- 旅途日志 ---- */
  .steps{display:flex;flex-direction:column;gap:7px}
  .step{background:var(--card2);border:1px solid var(--line);border-left:2px solid #4a4438;
        border-radius:9px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;position:relative}
  .step.k-refill{border-left-color:#7bb355}
  .step.k-setback{border-left-color:var(--bad)}
  .step.k-redirect{border-left-color:#7fb2e0}
  .step.k-companion{border-left-color:var(--gold)}
  .step.k-sight{border-left-color:#5a5348}
  .step-name{font-size:13px;color:#d8ceb8;font-weight:600}
  .step-text{font-size:12.5px;color:var(--fg3);line-height:1.65}
  .step-delta{position:absolute;right:10px;top:9px;font-size:11.5px;color:#9ab98a}

  /* ---- 等待 ---- */
  .waiting{text-align:center}
  .wait-art{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:20px}
  .wait-status{font-size:20px;font-weight:600;letter-spacing:.06em}
  .wait-detail{color:var(--fg2);font-size:13px;margin-top:10px;line-height:1.8}
  .waiting .steps{text-align:left;margin-top:6px}

  /* ---- 结果 ---- */
  .result{text-align:center}
  .card-wrap{margin:6px 0 16px;display:flex;justify-content:center}
  #postcard-canvas{border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.55);display:block}
  .meta{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
        font-size:12.5px;color:var(--fg2)}
  .rarity{border:1px solid var(--c);color:var(--c);border-radius:999px;padding:2px 10px;font-size:11.5px}
  .outcome{border-radius:999px;padding:2px 10px;font-size:11.5px;border:1px solid}
  .outcome.o-ok{color:#9ab98a;border-color:#465a34}
  .outcome.o-warn{color:var(--warn);border-color:#5a4a30}
  .outcome.o-bad{color:var(--bad);border-color:#4a322c}
  .journey-stat{margin-top:12px;font-size:12.5px;color:var(--fg3)}
  .toy-gain{margin-top:12px;font-size:13.5px;color:#c9a8ff}
  .toy-gain b{color:#dcc8ff}
  .used{margin-top:8px;font-size:12px;color:var(--fg3)}
  .diary{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:16px 18px;margin:16px 0 10px;font-size:14.5px;line-height:2;letter-spacing:.02em;
         white-space:pre-wrap;color:#e8e1d2}
  .diary.loading{opacity:.45}
  .src{font-size:11.5px;color:var(--fg3)}
  .src-ai{color:var(--green)}
  .companion{margin-top:14px;font-size:13.5px;color:var(--fg2)}
  .companion b{color:var(--fg)}
  .result .steps,.result .events{text-align:left}
  .events{margin-top:6px;display:flex;flex-direction:column;gap:8px}
  .event{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
         display:flex;flex-direction:column;gap:3px}
  .ev-cat{align-self:flex-start;font-size:10.5px;color:#8f9a7a;border:1px solid #3f4a34;
          border-radius:4px;padding:1px 6px;margin-bottom:2px}
  .ev-name{font-size:13.5px;color:#d8ceb8}
  .ev-desc{font-size:12.5px;color:var(--fg3);line-height:1.65}

  /* ---- 图鉴 ---- */
  .album{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .album-item{background:none;border:0;padding:0;cursor:pointer;position:relative;
              border-radius:8px;overflow:hidden;font-family:inherit}
  .album-thumb{display:block;background:var(--card2);aspect-ratio:2/3;border-radius:8px;
               border:1px solid var(--line);overflow:hidden}
  .album-rarity{position:absolute;left:5px;top:5px;font-size:10px;background:rgba(12,11,9,.78);
                color:var(--c);border-radius:5px;padding:1px 5px;border:1px solid var(--c)}
  .album-name{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;color:#e8e1d2;
              background:linear-gradient(180deg,transparent,rgba(12,11,9,.85));padding:10px 5px 4px;text-align:center}
  .empty{text-align:center;color:var(--fg3);padding:70px 0;line-height:2.2;font-size:14px}

  /* ---- 设置 ---- */
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:16px;margin-bottom:16px}
  .switch{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;margin-top:6px}
  .switch input{width:17px;height:17px;accent-color:#7bb355}
  .row{display:flex;gap:10px}
  .row .btn-ghost,.row .btn{flex:1;width:auto}
  .test-result{font-size:12.5px;margin-top:10px;color:var(--fg3);line-height:1.7}
  .test-result.ok{color:var(--green)}
  .test-result.bad{color:var(--bad)}
  select.input{appearance:none}

  /* 家：右上角设置齿轮 */
  .stage-gear{position:absolute;right:1.1em;top:1.0em;width:2.1em;height:2.1em;
              border-radius:.5em;background:rgba(14,13,11,.55);backdrop-filter:blur(4px);
              border:1px solid rgba(92,84,68,.8);color:#e8e1d2;font-size:.85em;cursor:pointer;
              display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
              font-family:inherit;transition:.15s}
  .stage-gear:hover{border-color:var(--green);color:#fff}

  .drop{background:var(--card2);border:1px solid var(--line);border-left:2px solid #3f3a30;
        border-radius:10px;padding:11px 13px}

  /* 成就 */
  .ach-total{font-size:13px;color:var(--fg2);margin-bottom:1em}
  .ach-total b{color:var(--green);font-size:15px}
  .ach-group{margin-bottom:1.3em}
  .ach-group-head{display:flex;justify-content:space-between;align-items:baseline;
                  font-size:13px;color:var(--fg2);margin-bottom:.5em;
                  border-bottom:1px solid var(--line);padding-bottom:.35em}
  .ach-group-head span{font-size:11.5px;color:var(--fg3)}
  .achs{display:flex;flex-direction:column;gap:7px}
  .ach{display:flex;gap:10px;align-items:center;background:var(--card2);
       border:1px solid var(--line);border-radius:10px;padding:9px 12px;opacity:.5}
  .ach.on{opacity:1;border-color:#4a5c38;background:#232a1d}
  .ach-icon{font-size:19px;filter:grayscale(1);flex:0 0 auto}
  .ach.on .ach-icon{filter:none}
  .ach-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .ach-body b{font-size:13.5px}
  .ach-body span{font-size:11.5px;color:var(--fg3);line-height:1.5}
  .ach-yes{color:var(--green);font-size:15px;flex:0 0 auto}

  .asset-stat{font-size:14px;color:var(--fg2);margin-top:.6em}  .asset-stat b{color:var(--green);font-size:16px}
  .asset-names{font-size:11.5px;color:var(--fg3);line-height:1.7;margin-top:.5em}
  /* 素材体检：只在数据表和素材对不上时才出现 */
  .warn-line{color:#e0a35c;line-height:1.7;margin-top:.35em}

  /* 她出门时那个按钮的状态 */
  .sbtn.busy{background:rgba(120,90,50,.35);border-color:#8a6a3a;color:#f0dcc0;
             font-weight:500;letter-spacing:.02em}

  /* 玩具箱：摆放上限 */
  .cap-bar{display:flex;justify-content:space-between;align-items:baseline;gap:1em;
           flex-wrap:wrap;font-size:12.5px;color:var(--fg2);
           padding:.7em 1.1em;margin:0 0 .2em;border-bottom:1px solid var(--line)}
  .cap-bar b{color:var(--green);font-size:14px}
  .cap-full{color:#e0a35c}
  .toy-blocked{opacity:.55}
  .toy-blocked .btn-ghost{cursor:not-allowed}

  /* 顶部状态条：她出门时换成回家的倒计时，点一下能打开旅途面板。
     这是独立元素，不复用 .stage-hint —— 那条提示带"9 秒后淡出"的动画，倒计时不能淡出。 */
  .stage-countdown{position:absolute;left:50%;top:1.0em;transform:translateX(-50%);
    display:flex;align-items:center;gap:.5em;cursor:pointer;
    background:rgba(14,13,11,.78);border:1px solid rgba(120,140,90,.6);
    border-radius:999px;padding:.42em 1.05em;
    font-size:.7em;color:var(--fg);white-space:nowrap;transition:.15s;z-index:2}
  .stage-countdown:hover{border-color:var(--green);background:rgba(20,26,16,.9)}
  .stage-countdown b{color:var(--green);font-weight:700}
  .cd-dot{width:.5em;height:.5em;border-radius:50%;background:var(--green);
          flex:0 0 auto;animation:cdpulse 1.6s ease-in-out infinite}
  @keyframes cdpulse{0%,100%{opacity:.35}50%{opacity:1}}
  .cd-eta{color:var(--fg3)}
  .cd-more{color:var(--green);margin-left:.25em}

  /* 等待面板：预计用时 */
  .wait-eta{text-align:center;margin:.9em 0 .1em}
  .wait-eta-main{font-size:16px;color:var(--fg)}
  .wait-eta-main b{color:var(--green);font-size:21px}
  .wait-eta-sub{font-size:12.5px;color:var(--fg3);margin-top:.4em;line-height:1.6}
  /* 面板要塞进 16:9 的舞台里，所以预览图不能太大，否则下面的内容会被挤出屏幕 */
  .waiting .wait-art{max-width:330px;margin:0 auto}
  .waiting .wait-status{font-size:16px;margin-top:.7em;text-align:center;color:var(--fg2)}
  .waiting .wait-detail{font-size:12px;margin-top:.5em;text-align:center}
  .waiting .label{margin-top:1em}
  .waiting .steps{max-height:8em;overflow:auto}

  /* 来访同伴的气泡（深色底，所以字也要改成浅色，否则看不见） */
  .bubble.visitor{border-color:#4a5c7a;background:rgba(21,25,33,.95);color:#e8eef6}
  .bubble.visitor.left{border-color:#4a5c7a}
  .bubble.visitor:after{border-top-color:rgba(21,25,33,.95);
                        border-left-color:transparent;border-right-color:transparent}

  /* 顶部左侧：同伴来访提示 */
  .visitor-chip{background:rgba(74,92,122,.55);border:1px solid #4a5c7a;color:#cfdcec;
                border-radius:999px;padding:.12em .7em;font-size:.86em}
  /* 她出门时顶部的标记 */
  .state-badge.away{background:rgba(120,90,50,.5);border-color:#8a6a3a;color:#f0dcc0}

  #toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;
         background:#2e2a22;border:1px solid var(--line);color:var(--fg);padding:10px 18px;
         border-radius:999px;font-size:13.5px;pointer-events:none;transition:.22s;z-index:99;
         box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #selftest-output{white-space:pre-wrap;font:12.5px/1.6 Consolas,Menlo,monospace;
                   padding:16px;color:#cfc7b6;display:none}
  body.selftest #selftest-output{display:block}
  body.selftest #screen{display:none}

  @media (min-width:760px){
    .tiles{grid-template-columns:repeat(5,1fr)}
    .album{grid-template-columns:repeat(6,1fr)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <pre id="selftest-output"></pre>
</div>
<div id="toast"></div>

<!-- 依赖顺序不可调整：后加载的模块在 IIFE 阶段就会取用前面的命名空间 -->
<script src="src/core/util.js"></script>
<script src="src/core/rng.js"></script>
<script src="src/data/config.js"></script>
<script src="src/data/geo.js"></script>
<script src="src/data/destinations.js"></script>
<script src="src/data/companions.js"></script>
<script src="src/data/events.js"></script>
<script src="src/data/templates.js"></script>
<script src="src/data/farm.js"></script>
<script src="src/data/kitchen.js"></script>
<script src="src/data/home.js"></script>
<script src="src/data/visitor.js"></script>
<script src="src/data/journey.js"></script>
<script src="src/data/achievements.js"></script>
<script src="src/engine/gacha.js"></script>
<script src="src/engine/journey.js"></script>
<script src="src/engine/trip.js"></script>
<script src="src/text/template-text.js"></script>
<script src="src/time/clock.js"></script>
<script src="src/store.js"></script>
<script src="src/render/placeholder.js"></script>
<script src="src/render/effects.js"></script>
<script src="src/render/frames.js"></script>
<script src="src/render/postcard.js"></script>
<script src="src/text/deepseek.js"></script>
<script src="src/geo.js"></script>
<script src="src/farm.js"></script>
<script src="src/home.js"></script>
<script src="src/achievements.js"></script>
<script src="src/sfx.js"></script>
<script src="assets/manifest.js"></script>
<script src="src/assets.js"></script>
<script src="src/ui.js"></script>
<script src="src/core/selftest.js"></script>

<script>
(function () {
  function boot() {
    var Q = new URLSearchParams(location.search);
    if (/(\?|&)selftest=1(&|$)/.test(location.search)) {
      document.body.classList.add('selftest');
      try { NT.selftest.run(); }
      catch (e) {
        var el = document.getElementById('selftest-output');
        if (el) el.textContent = '===SELFTEST-BEGIN===\n自检崩溃: ' + (e && e.stack || e) + '\n===SELFTEST-END===';
      }
      return;
    }
    try {
      NT.app.init();
      if (Q.get('demo')) {
        NT.app.save = NT.store.defaultSave();
        NT.app.demoSeed();
        NT.app.screen = Q.get('screen') || 'home';
        if (NT.app.screen === 'result' || NT.app.screen === 'waiting') {
          var al = NT.app.save.album;
          if (NT.app.screen === 'result' && al.length) NT.app.viewing = al[al.length - 1];
        }
        if (Q.get('modal')) NT.app.modal = Q.get('modal');
        if (Q.get('view') === 'last' && NT.app.save.album.length) {
          NT.app.viewing = NT.app.save.album[NT.app.save.album.length - 1];
        }
        NT.app.render();
        // 调试：?poke=1 自动戳她一下，方便截图看气泡
        if (Q.get('poke')) setTimeout(function () { NT.app.poke(); }, 400);
        // 调试：?walk=1 把她挪到最左边，逼她走一段（用来看走路动画）
        if (Q.get('walk')) {
          setTimeout(function () {
            if (NT.app._anim) { NT.app._anim.x = 0.02; NT.app._anim.y = 0.95; }
          }, 300);
        }
        // 调试：?setstate=read 直接把她设成某个状态（用来核对落点）
        if (Q.get('setstate')) {
          NT.app.save.home.nahida.stateId = Q.get('setstate');
          NT.app.save.home.nahida.until = Date.now() + 3600e3;   // 别让它马上又换掉
          NT.app.save.home.nahida.since = Date.now();
          if (NT.app._anim) NT.app._anim = null;                 // 让她直接出现在新位置
          NT.app.render();
        }
        // 调试：?visitor=1 强制放一位客人进来（看同伴的表现）
        // 注意要放在 setstate 之后 —— 客人的活动是按主角当时的位置挑的
        if (Q.get('visitor')) {
          var cid = Q.get('visitor') === '1' ? null : Q.get('visitor');
          NT.home.debugAddVisitor(NT.app.save, cid, Date.now());
          NT.app.render();
        }
        // 调试：?trip=1 立刻出发一趟（看等待面板和顶部倒计时）
        //       &due=8 让她 8 秒后就回来（用来验证"结算→弹明信片→按钮归位"整条链路）
        if (Q.get('trip')) {
          var dr = NT.clock.depart(NT.app.save, {
            mode: 'random', now: Date.now(), seed: 4242,
            dishId: 'none', rareItemIds: []
          });
          if (dr.ok) {
            var due = parseFloat(Q.get('due'));
            if (due > 0) {
              // 把到达时间和"剩余时长"一起压缩，否则进度条会显示还没走多远
              var total = dr.trip.durationMs || 1;
              dr.trip.dueAt = Date.now() + due * 1000;
              dr.trip.durationMs = Math.min(total, due * 1000);
              dr.trip.startedAt = Date.now() - (total - due * 1000);
            }
            NT.store.save(NT.app.save);
            var wantModal = Q.get('modal');
            NT.app.modal = (wantModal === null || wantModal === '') ? null : wantModal;
          } else {
            NT.app.toast('出发失败：' + dr.error);
          }
          NT.app.render();
        }
        // 调试：?probe=1 把素材加载状态和玩具摆放打到页面上
        if (Q.get('probe')) {
          setTimeout(function () {
            var el = document.getElementById('selftest-output');
            if (!el) return;
            var stt = NT.assets.status();
            var sv = NT.app.save;
            el.style.display = 'block';
            el.textContent = '===PROBE===\nassets=' + JSON.stringify(stt) +
              '\nloaded=' + NT.assets.loadedNames().join(' | ') +
              '\ntoys=' + (sv.toys || []).join(',') +
              '\nplaced=' + (sv.home.placed || []).map(function (p) {
                var sl = NT.data.toySlots[p.slot] || {};
                var toy = NT.data.toyById(p.toyId);
                return p.toyId + '@' + p.slot + '(' + (toy ? toy.name : '?') +
                  ' ' + sl.x + ',' + sl.y + ')';
              }).join('  ') +
              '\nstate=' + NT.app.save.home.nahida.stateId +
              '\nspot=' + JSON.stringify(NT.home.spot(NT.app.save)) +
              '\ncompanions=' + (NT.data.companions || []).map(function (c) {
                return c.id + (c.auto ? '(自动)' : '');
              }).join(',') +
              '\nsync=' + JSON.stringify(NT.assets.syncFromManifest()) +
              '\nanim=' + JSON.stringify(NT.app._anim) +
              '\n===END===';
          }, 2500);
        }
      } else if (Q.get('screen')) {
        NT.app.screen = Q.get('screen');
        NT.app.render();
      }
    } catch (e) {
      document.getElementById('screen').innerHTML =
        '<div class="pad" style="padding-top:60px;color:#d98b7a"><b>启动失败</b>' +
        '<pre style="white-space:pre-wrap;font-size:12px;margin-top:12px">' +
        String(e && e.stack || e) + '</pre></div>';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
